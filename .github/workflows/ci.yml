name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check noema/ --output-format=github

      - name: Ruff format check
        run: ruff format --check noema/

      - name: Encoding check
        run: python scripts/check_encoding.py

      - name: Mypy
        run: mypy noema/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,db]"

      - name: Run tests
        env:
          NOEMA_LLM_PROVIDER: fallback
          NOEMA_API_RATE_LIMIT_ENABLED: "false"
        run: |
          python -m pytest tests/ -v --tb=short --timeout=120 \
            --junitxml=results.xml \
            --cov=noema \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            results.xml
            htmlcov/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: |
          pip install bandit safety pip-audit

      - name: Bandit security scan
        run: bandit -r noema/ -f json -o bandit-report.json || true

      - name: Safety check
        run: safety check --json --output safety-report.json || true

      - name: pip-audit
        run: pip-audit --format=json --output=pip-audit-report.json || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
