name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

# CI только читает репозиторий: права объявлены явно, иначе job с умолчанию
# write-all получает запись в репозиторий «на всякий случай».
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check noema/ tests/ scripts/ --output-format=github

      - name: Ruff format check
        run: ruff format --check noema/ tests/ scripts/

      - name: Encoding check
        run: python scripts/check_encoding.py

      - name: Mojibake gate
        run: python scripts/find_mojibake.py

      - name: Mypy
        run: mypy noema/ --ignore-missing-imports --no-error-summary

  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,db,grpc]"

      - name: Run tests
        env:
          NOEMA_API_RATE_LIMIT_ENABLED: "false"
        shell: bash
        run: |
          python -m pytest tests/ -v --tb=short --timeout=120 \
            --junitxml=results.xml \
            --cov=noema \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            results.xml
            htmlcov/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: |
          pip install bandit pip-audit

      - name: Bandit security scan
        run: bandit -r noema/ -ll -f json -o bandit-report.json

      # safety давал `|| true` и не мог найти ничего (плюс тянул nltk с
      # непропатченной CVE) — убран. pip-audit читает собранное окружение и
      # падает на любой известной уязвимости; --exclude-editable снимает сам
      # пакет noema, который не на PyPI и потому не аудируется.
      - name: Pip audit
        run: |
          pip freeze --exclude-editable > requirements-audit.txt
          python -m pip_audit --strict --no-deps -r requirements-audit.txt

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            requirements-audit.txt
            pip-audit-report.json

  golden-eval:
    name: Golden Eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,db]"

      - name: Run golden eval
        env:
          NOEMA_API_RATE_LIMIT_ENABLED: "false"
          NOEMA_LLM__PROVIDER: "fallback"
        run: |
          python -m tests.eval.run_eval \
            --tasks tests/eval/golden_tasks.json \
            --output eval_results.json

      - name: Upload eval results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: golden-eval-results
          path: eval_results.json

  gate:
    name: Merge Gate (judge + sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the gate can diff the PR branch against its base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,db]"

      - name: Run merge gate
        id: gate
        env:
          NOEMA_API_RATE_LIMIT_ENABLED: "false"
        run: |
          python -m noema.experiments.gate \
            --diff-target "origin/${{ github.base_ref }}" \
            --judge-threshold "${{ vars.GATE_JUDGE_THRESHOLD || '0.0' }}" \
            --out gate.json

      - name: Upload gate report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: merge-gate-report
          path: gate.json
