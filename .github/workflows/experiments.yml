name: Experiments

on:
  workflow_dispatch:
  schedule:
    # Nightly synthetic benchmark using the mock fallback provider (no keys).
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Run experiments (fallback provider, no API keys)
        run: python -m noema.experiments.runner experiments/experiments.yaml --out results
      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: results/
          if-no-files-found: error
