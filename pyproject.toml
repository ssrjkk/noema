[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noema"
version = "1.1.0"
description = "Production-grade AI reasoning engine with 22 domain modules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Noema" }]

dependencies = [
    # Core
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",

    # Async / HTTP
    "aiohttp>=3.14.3",

    # Cache / queues
    "redis>=8.1.0",

    # API
    "fastapi>=0.100",
    "uvicorn[standard]>=0.52.1",

    # Data structures
    "networkx>=3.0",
    "numpy>=1.24",
    "scikit-learn>=1.9.0",

    # CLI
    "rich>=15.0.0",
    "typer>=0.9",

    # Structured logging
    "structlog>=23.0",

    # Metrics
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "pytest-benchmark>=5.2.3",
    "hypothesis>=6.0",
    "httpx>=0.28.1",
    "fakeredis>=2.20.0",
    "ruff>=0.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
]
db = [
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
]
full = [
    "chromadb>=1.5.9",
    "sentence-transformers>=2.0",
    "openai>=1.0",
    "z3-solver>=4.13",
]
sentry = [
    "sentry-sdk>=2.0",
]
grpc = [
    "grpcio>=1.60",
    "grpcio-tools>=1.83.0",
    "protobuf>=4.25",
]
vault = [
    "hvac>=2.4.0",
]
arq = [
    "arq>=0.26",
]

[project.scripts]
noema = "noema.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["noema/grpc/noema_engine_pb2*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["noema"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = false
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_untyped_decorators = false
ignore_missing_imports = true
implicit_reexport = true
no_implicit_optional = false
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(noema/grpc/noema_engine_pb2(_grpc)?\\.py$)"

[tool.hatch.build.targets.wheel]
packages = ["noema"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
