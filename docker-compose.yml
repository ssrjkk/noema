services:

  noema:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - compose.env
    environment:
      NOEMA_API_HOST: "0.0.0.0"
      NOEMA_API__CORS_ORIGINS: '["*"]'
      NOEMA_REDIS__URL: "redis://:${REDIS_PASSWORD:-noema}@redis:6379/0"
      NOEMA_DB__URL: "postgresql+asyncpg://noema:${POSTGRES_PASSWORD:-noema}@postgres:5432/noema"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - noema-network

  postgres:
    image: postgres:16
    container_name: noema-postgres
    environment:
      POSTGRES_USER: noema
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noema}
      POSTGRES_DB: noema
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noema -d noema"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - noema-network

  redis:
    image: redis:7-alpine
    container_name: noema-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-noema}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-noema}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - noema-network

volumes:
  postgres_data:

networks:
  noema-network:
    driver: bridge
