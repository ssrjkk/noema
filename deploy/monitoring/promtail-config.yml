server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: noema
    static_configs:
      - targets: [localhost]
        labels:
          job: noema
          service: noema
          __path__: /var/log/noema/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            correlation_id: correlation_id
            tenant_id: tenant_id
            task_id: task_id
      - labels:
          level:
          service:
      - drop:
          expression: ".*debug.*"
          too_old: 24h

  - job_name: noema-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: "(.+)"
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
      - labels:
          level:
          container:
