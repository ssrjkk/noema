apiVersion: v2
name: noema
description: >-
  Noema — autonomous AI SRE & engineering agent. Consumes incident webhooks
  (Sentry/Datadog/PagerDuty), generates validated fixes, opens PRs, runs the
  merge gate, and auto-approves/merges when the gate passes.
type: application
version: 0.1.0
appVersion: "1.0.0"

keywords:
  - ai
  - sre
  - autonomous
  - llm
  - incident-response

dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    tags:
      - noema-db
  - name: redis
    version: "20.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    tags:
      - noema-redis