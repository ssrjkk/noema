# Default values for noema

replicaCount: 2

image:
  repository: ghcr.io/noema/noema
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  metricsPort: 9090

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: noema.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: noema-tls
      hosts:
        - noema.example.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Background arq worker deployment (incident→PR jobs). Enabled separately
# from the API; requires Redis.
worker:
  enabled: false
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ─── Application config ──────────────────────────────────────────────────

env:
  NOEMA_API_PORT: "8000"
  NOEMA_API_RATE_LIMIT_RPM: "60"
  NOEMA_LLM_PROVIDER: "ollama"
  NOEMA_LLM_OLLAMA_MODEL: "llama3.1"
  NOEMA_OBS_LOGGING_LEVEL: "INFO"
  NOEMA_OBS_LOGGING_FORMAT: "json"
  NOEMA_OBS_METRICS_ENABLED: "true"
  NOEMA_AUTONOMY__GITHUB_REPO: ""
  NOEMA_AUTONOMY__GITHUB_BASE_BRANCH: "main"
  NOEMA_AUTONOMY__AUTO_APPROVE: "false"
  NOEMA_AUTONOMY__AUTO_MERGE: "false"

# Secrets are mounted as env vars via a Secret (never in ConfigMap).
secrets:
  apiKey: ""
  webhookSecret: ""
  githubToken: ""
  llmOpenAIKey: ""
  llmAnthropicKey: ""
  postgresPassword: ""
  redisPassword: ""

# External infrastructure (used when the bundled sub-charts are disabled).
# Placeholder credentials: replace before deploying — never run with the
# well-known defaults.
external:
  postgresUrl: "postgresql+asyncpg://noema:CHANGE_ME@noema-postgresql:5432/noema"
  redisUrl: "redis://:CHANGE_ME@noema-redis:6379/0"

# ─── Sub-chart toggles (bundled PostgreSQL/Redis) ────────────────────────
# Enable after `helm dependency update` (see NOTES.txt).
# Empty passwords make the sub-charts auto-generate a random secret on
# first install — never hardcode credentials here.

postgresql:
  enabled: false
  auth:
    username: noema
    password: ""
    database: noema
  primary:
    persistence:
      size: 10Gi

redis:
  enabled: false
  architecture: standalone
  auth:
    password: ""
  master:
    persistence:
      size: 2Gi

# ─── Probes ──────────────────────────────────────────────────────────────

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30