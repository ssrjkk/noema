# Default values for noema

replicaCount: 2

image:
  repository: ghcr.io/noema/noema
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  metricsPort: 9090

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: noema.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: noema-tls
      hosts:
        - noema.example.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# ─── Application config ──────────────────────────────────────────────────

env:
  NOEMA_API_PORT: "8000"
  NOEMA_API_RATE_LIMIT_RPM: "60"
  NOEMA_LLM_PROVIDER: "ollama"
  NOEMA_LLM_OLLAMA_MODEL: "llama3.1"
  NOEMA_OBS_LOGGING_LEVEL: "INFO"
  NOEMA_OBS_LOGGING_FORMAT: "json"
  NOEMA_OBS_METRICS_ENABLED: "true"
  NOEMA_DB_URL: "postgresql+asyncpg://noema:noema@noema-postgresql:5432/noema"
  NOEMA_REDIS_URL: "redis://noema-redis:6379/0"

# ─── Sub-chart toggles ──────────────────────────────────────────────────

postgresql:
  enabled: true
  auth:
    username: noema
    password: noema
    database: noema
  primary:
    persistence:
      size: 10Gi

redis:
  enabled: true
  architecture: standalone
  master:
    persistence:
      size: 2Gi

# ─── Probes ──────────────────────────────────────────────────────────────

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30
