{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "noema.fullname" . }}-worker
  labels:
    {{- include "noema.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "noema.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "noema.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "noema.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: noema-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec noema arq worker --redis "$$NOEMA_REDIS_URL"
          env:
            - name: NOEMA_AUTONOMY__GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "noema.fullname" . }}
                  key: githubToken
            {{- if .Values.postgresql.enabled }}
            - name: NOEMA_DB_URL
              value: "postgresql+asyncpg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "noema.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            {{- else }}
            - name: NOEMA_DB_URL
              value: {{ .Values.external.postgresUrl | quote }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: NOEMA_REDIS_URL
              value: "redis://:{{ .Values.redis.auth.password }}@{{ include "noema.fullname" . }}-redis-master:6379/0"
            {{- else }}
            - name: NOEMA_REDIS_URL
              value: {{ .Values.external.redisUrl | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "noema.fullname" . }}-config
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}